swagger: "2.0"
info:
  title: C++ Base Library API
  version: "0.2.0"
  description: |
    REST API for the lintel.
    Authentication: obtain a bearer token via POST /user/login (HTTP Basic auth),
    then pass it as `Authorization: Bearer <token>` on subsequent requests.
host: localhost:8080
schemes:
  - http
paths:
  /admin/reload-tls:
    post:
      summary: Reload the TLS certificate of the running server
      description: |
        Re-reads the certificate and private key files configured for the HTTP
        server and swaps them into the running OpenSSL context, so a renewal
        takes effect without restarting the process.
        The server keeps the pair it was serving and puts it back when a
        renewal is rejected, so a broken pair never takes the endpoint down.
        Answers 409 when the process does not serve TLS at all.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reload succeeded (TlsReloadResultDto JSON)
          schema:
            $ref: "#/definitions/TlsReloadResultDto"
        "401":
          description: Unauthorized (missing token or not in the Admin group)
        "403":
          description: Forbidden (wrong content type)
        "409":
          description: Nothing to reload (the server is not running with TLS)
        "500":
          description: Reload failed; the previous certificate stays active
          schema:
            $ref: "#/definitions/TlsReloadResultDto"
  /admin/log-level:
    post:
      summary: Change the log level of the running process
      description: |
        Applies a new log level to every subsequent log call in this process,
        so a running system can be re-diagnosed without a restart. The
        bootstrap configuration is not rewritten, a restart therefore falls
        back to the level the operator deployed. Answers 400 for an unknown or
        mistyped level and 401 outside the Admin-Log group. Every response of
        this route carries an X-Request-Id header (echoed from the request when it matches
        [A-Za-z0-9._-]{1,64}, generated otherwise) that the handling process also
        writes into its log lines for that request.
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - level
            properties:
              level:
                type: string
                description: "trace, debug, info, warn, err (or error), critical or off"
                example: debug
      responses:
        "200":
          description: Level applied
          schema:
            $ref: "#/definitions/LogLevelResultDto"
          headers:
            X-Request-Id:
              type: string
              description: >-
                Correlation id of this request, also written into the log lines;
                a client supplied id that does not match [A-Za-z0-9._-]{1,64} is
                replaced by a generated one
        "400":
          description: Body is not json or the level name is unknown; the level is unchanged
          schema:
            $ref: "#/definitions/LogLevelResultDto"
        "401":
          description: Unauthorized (missing token or not in the Admin group)
        "403":
          description: Forbidden (wrong content type)
  /hello:
    get:
      summary: Greets the user
      description: >
        Returns a personalized greeting if a valid Bearer token is provided,
        otherwise a generic "Hello World!".
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response (text/plain)
        "500":
          description: Internal server error
  /health:
    get:
      summary: Liveness probe
      description: >
        Returns 200 with {"status":"ok"} as long as the HTTP process is alive.
        Unauthenticated so orchestrators (Kubernetes probes, Docker healthcheck)
        can use it.
      responses:
        "200":
          description: A successful response
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
  /ready:
    get:
      summary: Readiness probe
      description: >
        Runs the dependency checks registered at startup (a "database:<name>"
        SELECT 1 ping per configured connection, "shared_memory" for the mapped
        segments) and returns 200 with
        {"status":"ready","checks":{"<name>":"ok",...}} when all pass. While a
        dependency is down it returns 503 with
        {"status":"not_ready","checks":{"<name>":"failed: <reason>",...}}. With no
        check registered it answers 200 with the legacy {"status":"ready"}.
        Unauthenticated; use it for Kubernetes readiness probes, /health for
        liveness.
      responses:
        "200":
          description: The process is ready to serve traffic
          schema:
            type: object
            properties:
              status:
                type: string
                example: ready
              checks:
                type: object
                additionalProperties:
                  type: string
                example:
                  database:DEFAULT_PSQL: ok
                  shared_memory: ok
        "503":
          description: A dependency check failed
          schema:
            type: object
            properties:
              status:
                type: string
                example: not_ready
              checks:
                type: object
                additionalProperties:
                  type: string
                example:
                  database:DEFAULT_PSQL: "failed: connection refused"
                  shared_memory: ok
  /history/{processName}/{serviceName}/{label}:
    get:
      summary: Get history
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: serviceName
          in: path
          required: true
          type: string
        - name: label
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /messageQueue/{processName}/{messageQueueName}:
    get:
      summary: Get message queue
      description: >
        Returns message queues matching the given name patterns as a JSON array.
        With the optional query parameters 'after' and 'limit' the result is
        keyset-paginated (ordered by queue name ascending) and returned as an
        envelope object {items, has_more, next_after}. Follow next_after to
        retrieve the next page.
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: messageQueueName
          in: path
          required: true
          type: string
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on queue name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of entries per page (default 100).
      responses:
        "200":
          description: A successful response (array of message queues, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /messageQueue/stats/{processName}/{messageQueueName}:
    get:
      summary: Get message queue statistics
      description: >
        Returns the message queues matching the given name patterns with their
        operational state as a JSON array. The payload is built by the same code
        path as /messageQueue/{processName}/{messageQueueName}: every entry
        carries NAME, PROCESS, MAX_MESSAGES, MESSAGES and CONSUMER_LAG plus
        ALIVE, and - only while an owner is registered - OWNER_PID, OWNER_HOST,
        OWNER_STATE, STARTED_AT, LAST_HEARTBEAT_AT and HEARTBEAT_AGE_MS, as well
        as DEAD_LETTER_QUEUE and DEAD_LETTER_SIZE when a dead-letter queue is
        configured. Absent optional fields are omitted from the JSON object.
        CONSUMER_LAG is the number of messages still waiting for a consumer; the
        queue has no consumer cursor of its own, so it equals MESSAGES.
        With the optional query parameters 'after' and 'limit' the result is
        keyset-paginated (ordered by queue name ascending) and returned as an
        envelope object {items, has_more, next_after} whose entries are built
        without a queue reading, i.e. with MESSAGES and CONSUMER_LAG set to 0.
        Follow next_after to retrieve the next page. Reading requires a token of
        a user in the "Admin-MessageQueue" or "User-MessageQueue" group.
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: messageQueueName
          in: path
          required: true
          type: string
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on queue name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of entries per page (default 100).
      responses:
        "200":
          description: A successful response (array of message queues with their statistics, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /messageQueue/purge/{processName}:
    post:
      summary: Purge a message queue
      description: >
        Removes every message that is currently in the named queue and answers
        with the queue name and the number of removed messages
        ({"NAME":"orders","PURGED":42}). The queue name is
        looked up through a repository API that treats it as a pattern, so only an
        exact name match is purged: a name that merely matches a queue as a
        pattern (for example "mq-.*") answers 404, one call can therefore never
        drain several queues. If opening the queue or deleting its messages fails,
        the handler answers 500. Purging is destructive and requires a token of a
        user in the "Admin-MessageQueue" group; a member of "User-MessageQueue"
        alone gets 401.
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
          description: Exact message queue name to drain; patterns are rejected with 404.
      responses:
        "200":
          description: Queue purged (MessageQueuePurgeDto JSON)
          schema:
            type: object
            required:
              - NAME
              - PURGED
            properties:
              NAME:
                type: string
                description: Name of the purged queue
                example: orders
              PURGED:
                type: integer
                format: int32
                description: Number of messages that were removed
                example: 42
        "401":
          description: Unauthorized (missing token or not in the Admin-MessageQueue group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown queue name (the name matches no queue exactly)
        "500":
          description: Internal server error (queue could not be opened or drained)
  /messageQueue/recover:
    post:
      summary: Recover orphaned message queues
      description: >
        Reclaims the message queue entries whose recorded owner process is gone
        and answers with the number of reclaimed entries ({"RECOVERED":2}). An
        entry whose owner is still alive is never touched, no matter how old its
        heartbeat is. Reclaiming mutates queue state and requires a token of a
        user in the "Admin-MessageQueue" group; a member of "User-MessageQueue"
        alone gets 401.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entries reclaimed ({"RECOVERED":n})
          schema:
            type: object
            required:
              - RECOVERED
            properties:
              RECOVERED:
                type: integer
                format: int64
                description: Number of reclaimed queue entries
                example: 2
        "401":
          description: Unauthorized (missing token or not in the Admin-MessageQueue group)
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /eventBus/buses:
    get:
      summary: List event buses
      description: >
        Returns every configured event bus with its validated bootstrap
        configuration and, while the bus can be opened in its shared memory
        segment (AVAILABLE), its runtime counters. A bus whose bootstrap
        configuration is invalid is still listed, with AVAILABLE false and
        without configuration fields; a bus whose segment is missing reports
        AVAILABLE false but keeps its configuration. Reading requires a token
        of a user in the "Admin-EventBus" or "User-EventBus" group.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All configured event buses
          schema:
            type: array
            items:
              $ref: '#/definitions/EventBusDto'
        "401":
          description: Unauthorized (missing token or not in an event bus group)
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /eventBus/bus/{name}:
    get:
      summary: Get one event bus
      description: >
        Returns the same object as one entry of /eventBus/buses for exactly one
        bus. An unknown name answers 404. Reading requires a token of a user in
        the "Admin-EventBus" or "User-EventBus" group.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
          description: Exact bus name
      responses:
        "200":
          description: The event bus (EventBusDto JSON)
          schema:
            $ref: '#/definitions/EventBusDto'
        "401":
          description: Unauthorized (missing token or not in an event bus group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown bus name
        "500":
          description: Internal server error
  /eventBus/publish/{name}:
    post:
      summary: Publish an event on a bus
      description: >
        Builds an Event from the JSON body and hands it to the bus. TOPIC and
        TYPE are required, PAYLOAD is an optional string of at most 256 bytes,
        PRIORITY is one of Critical, High, Normal or Low (default Normal) and
        TARGET is BUS (default, the point-to-point queue) or SUBSCRIBERS (the
        queues of every matching subscriber). Names longer than 31 bytes and
        payloads longer than 256 bytes answer 400 instead of being truncated.
        Publishing requires the "Publisher-EventBus" group (or "Admin-EventBus");
        "User-EventBus" is read-only and gets 401.
        A full queue is not an error: the answer carries PUBLISHED false and
        the bus counts the event as dropped. With TARGET SUBSCRIBERS, PUBLISHED
        is also false when no subscription matched the topic.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
          description: Exact bus name
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - TOPIC
              - TYPE
            properties:
              TOPIC:
                type: string
                maxLength: 31
                description: Topic of the event
                example: orders.created
              TYPE:
                type: string
                maxLength: 31
                description: Type of the event
                example: OrderCreated
              PAYLOAD:
                type: string
                maxLength: 256
                description: Payload of the event
                example: "42"
              PRIORITY:
                type: string
                enum: [Critical, High, Normal, Low]
                description: Delivery priority inside the subscriber queues (default Normal)
              TARGET:
                type: string
                enum: [BUS, SUBSCRIBERS]
                description: BUS for the point-to-point queue (default), SUBSCRIBERS for a broadcast
      responses:
        "200":
          description: The event was handed to the bus
          schema:
            type: object
            required:
              - BUS
              - PRIORITY
              - PUBLISHED
              - SEQUENCE
              - TARGET
              - TOPIC
              - TYPE
            properties:
              BUS:
                type: string
                example: orders
              PRIORITY:
                type: string
                enum: [Critical, High, Normal, Low]
              PUBLISHED:
                type: boolean
                description: False when every matching queue was full or no subscription matched
              SEQUENCE:
                type: integer
                format: int64
                description: Last sequence number assigned by the bus
              TARGET:
                type: string
                enum: [BUS, SUBSCRIBERS]
              TOPIC:
                type: string
              TYPE:
                type: string
        "400":
          description: Body is not json, a required member is missing, a name or the payload is too long, or PRIORITY/TARGET is unknown
        "401":
          description: Unauthorized (missing token or not in an event bus group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown bus name
        "500":
          description: Internal server error
  /eventBus/subscribe/{name}:
    post:
      summary: Subscribe a subscriber to a topic
      description: >
        Adds the named subscriber to the topic. An exact topic is registered
        implicitly, so a subscriber can join a topic that was never published
        before; wildcard patterns (`*` matches any sequence, `?` matches one
        character) register themselves. The answer reports SUBSCRIBED false when
        the topic or subscriber table of the bus is full. Subscribing requires a
        token of a user in the "Admin-EventBus" group; a member of
        "User-EventBus" alone gets 401.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
          description: Exact bus name
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - TOPIC
              - SUBSCRIBER
            properties:
              TOPIC:
                type: string
                maxLength: 31
                description: Topic name or wildcard pattern
                example: orders.*
              SUBSCRIBER:
                type: string
                maxLength: 31
                description: Name of the subscriber
                example: worker
      responses:
        "200":
          description: The subscription was attempted
          schema:
            type: object
            required:
              - BUS
              - SUBSCRIBER
              - SUBSCRIBED
              - TOPIC
            properties:
              BUS:
                type: string
              SUBSCRIBER:
                type: string
              SUBSCRIBED:
                type: boolean
                description: False when the topic or subscriber table is full
              TOPIC:
                type: string
        "400":
          description: Body is not json, a required member is missing or a name is too long
        "401":
          description: Unauthorized (missing token or not in the Admin-EventBus group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown bus name
        "500":
          description: Internal server error
    delete:
      summary: Unsubscribe a subscriber from a topic
      description: >
        Removes the subscription of the named subscriber from the topic and
        answers with UNSUBSCRIBED false when there was no such subscription.
        Unsubscribing requires a token of a user in the "Admin-EventBus" group.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
          description: Exact bus name
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - TOPIC
              - SUBSCRIBER
            properties:
              TOPIC:
                type: string
                maxLength: 31
              SUBSCRIBER:
                type: string
                maxLength: 31
      responses:
        "200":
          description: The subscription was removed or did not exist
          schema:
            type: object
            required:
              - BUS
              - SUBSCRIBER
              - TOPIC
              - UNSUBSCRIBED
            properties:
              BUS:
                type: string
              SUBSCRIBER:
                type: string
              TOPIC:
                type: string
              UNSUBSCRIBED:
                type: boolean
                description: True when a subscription was removed
        "400":
          description: Body is not json, a required member is missing or a name is too long
        "401":
          description: Unauthorized (missing token or not in the Admin-EventBus group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown bus name
        "500":
          description: Internal server error
  /eventBus/depth/{name}/{subscriber}:
    get:
      summary: Get the queue depth of one subscriber
      description: >
        Returns the best-effort number of events waiting in the queues of the
        named subscriber. The value is approximate while other processes push
        or pop events concurrently; an unknown subscriber reports 0. Reading
        requires a token of a user in the "Admin-EventBus" or "User-EventBus"
        group.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
          description: Exact bus name
        - name: subscriber
          in: path
          required: true
          type: string
          description: Subscriber name (at most 31 bytes)
      responses:
        "200":
          description: Queue depth of the subscriber
          schema:
            type: object
            required:
              - BUS
              - DEPTH
              - SUBSCRIBER
            properties:
              BUS:
                type: string
              DEPTH:
                type: integer
                format: int64
              SUBSCRIBER:
                type: string
        "400":
          description: Subscriber name is longer than 31 bytes
        "401":
          description: Unauthorized (missing token or not in an event bus group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown bus name
        "500":
          description: Internal server error
  /eventBus/reset/{name}:
    post:
      summary: Reset an event bus
      description: >
        Drops every queued event of the bus and of all subscriber queues and
        answers with RESET true. Resetting is destructive and requires a token
        of a user in the "Admin-EventBus" group; a member of "User-EventBus"
        alone gets 401.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
          description: Exact bus name
      responses:
        "200":
          description: The bus was reset
          schema:
            type: object
            required:
              - BUS
              - RESET
            properties:
              BUS:
                type: string
              RESET:
                type: boolean
        "401":
          description: Unauthorized (missing token or not in the Admin-EventBus group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown bus name
        "500":
          description: Internal server error
  /process/processes/{groupName}:
    get:
      summary: Get all processes
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
          description: Regex pattern to filter process groups
      responses:
        "200":
          description: A successful response
        "400":
          description: Invalid regex pattern
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /process/restart/{processId}:
    put:
      summary: Restart a process
      description: >
        Stops and starts the process again. Requires a bearer token of a user
        in the "Admin-Process" group.
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown process id
        "500":
          description: Internal server error
  /process/reset/{processId}:
    post:
      summary: Reset a process
      description: >
        Resets the restart counter and the failure state of the process without
        stopping it. Requires a bearer token of a user in the "Admin-Process" group.
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown process id
        "500":
          description: Internal server error
  /process/groups/{groupName}:
    get:
      summary: Get all process groups
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /process/health/{processId}:
    get:
      summary: Health of a single process
      description: >
        Returns the ProcessInfoDto of one active process. Requires a bearer token
        of a user in the "Admin-Process" group.
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
          schema:
            $ref: "#/definitions/ProcessInfoDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown or not active process id
        "500":
          description: Internal server error
  /process/start:
    post:
      summary: Start a process
      description: >
        Starts the process described by the JSON body (ProcessInfoDto: path, args,
        auto_restart, max_auto_restarts). A missing Content-Type header defaults to
        application/json.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response, returns the id of the started process
          schema:
            type: object
            properties:
              id:
                type: string
                example: 3f2a1c9e-8b7d-4c6a-9f10-2ab5cd8e71f3
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (explicit non-JSON content type)
        "500":
          description: Internal server error
  /process/stop/{processId}:
    delete:
      summary: Stop a process
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown process id
        "500":
          description: Internal server error
  /process/terminate/{processId}:
    delete:
      summary: Terminate a process
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown process id
        "500":
          description: Internal server error
  /shm/stats/{segmentName}:
    get:
      summary: Get the runtime statistics of one segment
      description: >
        Returns the statistics of exactly one shared memory segment as a JSON
        object with the fields NAME, ALLOCATED_BYTES, CAPACITY_BYTES,
        FREE_BYTES, GROW_COUNT, SHRINK_COUNT, RECOVERY_COUNT and GENERATION.
        CAPACITY_BYTES is the configured maximum size, or ALLOCATED_BYTES when
        the segment has no maximum. Reading requires a token of a user in the
        "Admin-Shm" or "User-Shm" group; an unknown segment answers 404.
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
          description: Exact segment name
      responses:
        "200":
          description: Segment statistics (JSON object)
          schema:
            type: object
            required:
              - NAME
              - ALLOCATED_BYTES
              - CAPACITY_BYTES
              - FREE_BYTES
              - GROW_COUNT
              - SHRINK_COUNT
              - RECOVERY_COUNT
              - GENERATION
            properties:
              NAME:
                type: string
                description: Name of the segment
                example: user
              ALLOCATED_BYTES:
                type: integer
                format: int64
                description: Currently allocated size of the segment
                example: 67108864
              CAPACITY_BYTES:
                type: integer
                format: int64
                description: Configured maximum size, or the allocated size when there is no maximum
                example: 268435456
              FREE_BYTES:
                type: integer
                format: int64
                description: Free bytes inside the segment
                example: 12345678
              GROW_COUNT:
                type: integer
                format: int64
                description: Number of grow operations on this segment
                example: 2
              SHRINK_COUNT:
                type: integer
                format: int64
                description: Number of shrink operations on this segment
                example: 0
              RECOVERY_COUNT:
                type: integer
                format: int64
                description: Number of reclaimed remap locks of this segment
                example: 1
              GENERATION:
                type: integer
                format: int64
                description: Generation counter of the segment mapping
                example: 3
        "401":
          description: Unauthorized (missing token or neither in the Admin-Shm nor the User-Shm group)
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown segment
        "500":
          description: Internal server error
  /shm/cleanup:
    post:
      summary: Remove orphaned shared memory objects
      description: >
        Runs the cleanup service in apply mode: every registered shared memory
        object whose recorded owner process is gone is removed from its segment
        and answers with the counts of the run as a JSON object with the fields
        DRY_RUN, SCANNED, ORPHANS, REMOVED and FAILED. DRY_RUN is always false
        because this endpoint applies; the scan-only mode of the service is not
        exposed. An object whose owner is still alive is never touched, no
        matter how old its heartbeat is. A failed removal keeps its registration
        and is retried by the next run, so FAILED may be non-zero while the
        request still answers 200. Cleanup is destructive and requires a token
        of a user in the "Admin-Shm" group; a member of "User-Shm" alone gets
        401.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cleanup applied (JSON object with the run counts)
          schema:
            type: object
            required:
              - DRY_RUN
              - SCANNED
              - ORPHANS
              - REMOVED
              - FAILED
            properties:
              DRY_RUN:
                type: boolean
                description: Always false - this endpoint applies the cleanup
                example: false
              SCANNED:
                type: integer
                format: int64
                description: Number of registered objects inspected
                example: 3
              ORPHANS:
                type: integer
                format: int64
                description: Number of orphaned objects found
                example: 1
              REMOVED:
                type: integer
                format: int64
                description: Number of orphaned objects actually removed
                example: 1
              FAILED:
                type: integer
                format: int64
                description: Number of removals that failed and are retried by the next run
                example: 0
        "401":
          description: Unauthorized (missing token or not in the Admin-Shm group)
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /shm/recover:
    post:
      summary: Reclaim the remap locks of segments whose holder is gone
      description: >
        Reclaims the remap semaphore of every shared memory segment this
        process maps whose recorded holder process no longer exists and answers
        with the number of reclaimed locks ({"RECOVERED":1}). A lock whose
        holder is still alive is never touched, no matter how long it has been
        held. Opening a segment already runs the same check once, so this
        endpoint is the repeat an operator needs for a segment that got stuck
        later on. Reclaiming changes the lock state of a segment and requires a
        token of a user in the "Admin-Shm" group; a member of "User-Shm" alone
        gets 401.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Locks reclaimed ({"RECOVERED":n})
          schema:
            type: object
            required:
              - RECOVERED
            properties:
              RECOVERED:
                type: integer
                format: int64
                description: Number of reclaimed remap locks
                example: 1
        "401":
          description: Unauthorized (missing token or not in the Admin-Shm group)
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /shm/segments/{segmentName}:
    get:
      summary: Get all segments
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /shm/segments/shrink/{segmentName}:
    put:
      summary: Shrink a segment
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or unknown segment)
        "500":
          description: Internal server error
  /shm/segments/grow/{segmentName}/{size}:
    put:
      summary: Grow a segment
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
        - name: size
          in: path
          required: true
          type: string
          description: New size in bytes
      responses:
        "200":
          description: A successful response
        "400":
          description: Unparseable size string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or unknown segment)
        "500":
          description: Internal server error
  /shm/repositories/{repositoryName}/{segmentName}:
    get:
      summary: Get all repositories
      security:
        - bearerAuth: []
      parameters:
        - name: repositoryName
          in: path
          required: true
          type: string
          description: Regex pattern to filter repository names
        - name: segmentName
          in: path
          required: true
          type: string
          description: Regex pattern to filter segment names
      responses:
        "200":
          description: A successful response
        "400":
          description: Invalid regex pattern
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /shm/repository/{uuid}:
    get:
      summary: Export a repository
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown repository UUID
        "500":
          description: Internal server error
  /user/login:
    post:
      summary: User login
      description: |
        Authenticate via HTTP Basic auth (base64-encoded user:password).
        Returns a UserDto with the bearer token on success.
        Passes must NOT hold a valid bearer token already.
      parameters:
        - name: Authorization
          in: header
          required: true
          type: string
          description: "Basic base64(user:password)"
      responses:
        "200":
          description: A successful response (UserDto JSON)
        "403":
          description: Invalid credentials, already logged in, or malformed Basic header
        "500":
          description: Internal server error
  /user/logout:
    delete:
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
  /user/state:
    get:
      summary: Get user login state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response (empty body)
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
  /user/groups:
    get:
      summary: Get all groups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
    post:
      summary: Create a group
      description: |
        Creates a non-virtual (collecting) group. Virtual groups carry the access
        rights and are defined in the code itself, so "virtual": true is rejected
        with 400. The response is the created GroupDto.
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/GroupDto"
      responses:
        "200":
          description: A successful response (the created GroupDto)
        "400":
          description: Bad request (malformed body, empty group_name, or virtual=true)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "409":
          description: Conflict (a group with this name already exists)
        "500":
          description: Internal server error
  /user/groups/{groupNameOrIsVirtual}:
    get:
      summary: Get all groups by name or virtual flag
      security:
        - bearerAuth: []
      parameters:
        - name: groupNameOrIsVirtual
          in: path
          required: true
          type: string
          description: Group name or "true"/"false" for virtual filter
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
    delete:
      summary: Delete a group
      description: |
        Deletes the group named by the path segment (the parameter name is shared
        with the GET operation of this path). The response reports the outcome
        as {"group_name":"<name>","removed":true}.
      security:
        - bearerAuth: []
      parameters:
        - name: groupNameOrIsVirtual
          in: path
          required: true
          type: string
          description: Name of the group to delete
      responses:
        "200":
          description: A successful response ({"group_name":...,"removed":true})
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown group
        "409":
          description: Conflict (the group is still assigned to a user)
        "500":
          description: Internal server error
  /user/groups/{groupName}/{isVirtual}:
    get:
      summary: Get all groups by name and virtual flag
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
        - name: isVirtual
          in: path
          required: true
          type: boolean
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/groups/{groupName}/subgroups/{subGroupName}:
    post:
      summary: Add a subgroup to a group
      description: |
        Adds a virtual group as member of a non-virtual (collecting) group. Both
        groups must exist; the parent group must not be virtual and the added
        group must be virtual, otherwise the request is rejected with 400.
        Adding an existing member is idempotent: the response then reports
        "added": false.
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
          description: Collecting group
        - name: subGroupName
          in: path
          required: true
          type: string
          description: Virtual group to add
      responses:
        "200":
          description: A successful response ({"group_name":...,"sub_group_name":...,"added":true|false})
        "400":
          description: Bad request (virtual parent group or non-virtual subgroup)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown group or subgroup
        "500":
          description: Internal server error
    delete:
      summary: Remove a subgroup from a group
      description: |
        Removes a virtual group from a non-virtual (collecting) group. Removing a
        member that is not listed is idempotent: the response then reports
        "removed": false.
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
          description: Collecting group
        - name: subGroupName
          in: path
          required: true
          type: string
          description: Virtual group to remove
      responses:
        "200":
          description: A successful response ({"group_name":...,"sub_group_name":...,"removed":true|false})
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown group or subgroup
        "500":
          description: Internal server error
  /user/users:
    get:
      summary: Get all users
      description: >
        Returns all users as a JSON array. With the optional query parameters
        'after' and 'limit' the result is keyset-paginated (ordered by
        user_name ascending) and returned as an envelope object
        {items, has_more, next_after}. Follow next_after to retrieve the next page.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on user_name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of users per page (default 100).
      responses:
        "200":
          description: A successful response (array of users, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/users/{userName}:
    get:
      summary: Get all users by user name
      description: >
        Filters users by a regular expression on user_name. Supports the same
        optional keyset-paging parameters ('after', 'limit') as /user/users;
        when paging is active the response is the envelope object
        {items, has_more, next_after}.
      security:
        - bearerAuth: []
      parameters:
        - name: userName
          in: path
          required: true
          type: string
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on user_name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of users per page (default 100).
      responses:
        "200":
          description: A successful response (array of users, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/add:
    post:
      summary: Add a user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "406":
          description: Not Acceptable (missing password)
        "500":
          description: Internal server error
  /user/update:
    put:
      summary: Update a user (group membership)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or unknown target user)
        "500":
          description: Internal server error
  /user/delete:
    delete:
      summary: Delete users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or self-delete attempt)
        "500":
          description: Internal server error
  /user/password:
    put:
      summary: Change the password of a user
      description: |
        Self-service requires the current (old) password, an admin may omit it.
        Passwords are transmitted Base64-encoded.
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/UserPasswordChangeDto"
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (empty/unknown username, wrong old password, wrong content type)
        "406":
          description: Not Acceptable (empty new password)
        "500":
          description: Internal server error
  /user/sessions:
    get:
      summary: Get all active sessions of the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
          schema:
            type: array
            items:
              $ref: "#/definitions/UserSessionDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/sessions/{sessionId}:
    delete:
      summary: Revoke an active session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized (no token, wrong group, or revoking foreign session as non-admin)
        "500":
          description: Internal server error
  /properties/{processName}/{className}/{instanceName}:
    get:
      summary: Get all properties
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
    put:
      summary: Update a property
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /properties/{processName}/{className}/{instanceName}/{propertyName}:
    get:
      summary: Get a property
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
        - name: propertyName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "405":
          description: Property not found
        "500":
          description: Internal server error
    put:
      summary: Update a property
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
        - name: propertyName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "405":
          description: Property not found, no runtime change support, or bad value
        "500":
          description: Internal server error
definitions:
  GroupDto:
    type: object
    description: >
      A user group. Non-virtual groups collect virtual groups, which carry the
      access rights checked by the controllers.
    properties:
      group_name:
        type: string
        description: Unique group name
        example: Administrators
      groups:
        type: array
        description: Members of a collecting group (omitted while empty)
        items:
          $ref: "#/definitions/GroupDto"
      virtual:
        type: boolean
        description: True for virtual groups, which are defined in the code and not persisted
        example: false
    required:
      - group_name
  EventBusDto:
    type: object
    description: >
      One configured event bus. The configuration fields are omitted while the
      bootstrap entry is invalid; the runtime counters are omitted while the bus
      cannot be opened in its shared memory segment.
    properties:
      NAME:
        type: string
        description: Name of the bus
        example: orders
      AVAILABLE:
        type: boolean
        description: True while the bus can be opened in its shared memory segment
      BUS_CAPACITY:
        type: integer
        format: int64
        description: Capacity of the point-to-point bus queue
        example: 128
      SUBSCRIBER_CAPACITY:
        type: integer
        format: int64
        description: Capacity of every per-subscriber queue
        example: 128
      MAX_TOPICS:
        type: integer
        format: int64
        description: Maximum number of registerable topics
        example: 16
      MAX_SUBSCRIBERS:
        type: integer
        format: int64
        description: Maximum number of registerable subscribers
        example: 32
      MAX_PRIORITIES:
        type: integer
        format: int64
        description: Number of priority queues per subscriber
        example: 4
      PUB_POLICY:
        type: string
        enum: [Fail, DropOldest, DropNewest, Block]
        description: Drop policy when a queue is full
      STICKY:
        type: boolean
        description: Whether sticky/last-value events are enabled
      STICKY_TTL_MS:
        type: integer
        format: int32
        description: TTL of sticky events in milliseconds
        example: 60000
      DROPPED:
        type: integer
        format: int64
        description: Number of events dropped because a queue was full
        example: 0
      TOPIC_COUNT:
        type: integer
        format: int64
        description: Number of registered topics
        example: 2
      SUBSCRIBER_COUNT:
        type: integer
        format: int64
        description: Number of reserved subscriber slots
        example: 1
      BUS_DEPTH:
        type: integer
        format: int64
        description: Best-effort depth of the point-to-point queue
        example: 0
      SEQUENCE:
        type: integer
        format: int64
        description: Last sequence number assigned by the bus
        example: 7
    required:
      - NAME
      - AVAILABLE
  ProcessInfoDto:
    type: object
    properties:
      id:
        type: string
        description: Library-internal process id
      path:
        type: string
        description: Executable path
      args:
        type: array
        description: Command line arguments
        items:
          type: object
          properties:
            arg:
              type: string
      auto_restart:
        type: boolean
        description: Whether the process is restarted automatically
      restarts:
        type: integer
        format: int32
        description: Restart counter since the last reset
      max_restarts:
        type: integer
        format: int32
        description: Maximum number of automatic restarts
      process_id:
        type: integer
        format: int32
        description: Operating system process id
      runs:
        type: boolean
        description: Whether the process is currently running
      exit_code:
        type: integer
        format: int32
        description: Last exit code, only meaningful if exit_code_valid is true
      exit_code_valid:
        type: boolean
        description: Whether exit_code carries a real exit code
      group_name:
        type: string
        description: Name of the process group
      group_id:
        type: string
        description: Id of the process group
      resources_valid:
        type: boolean
        description: Whether the resource fields below were collected
      uptime_seconds:
        type: integer
        format: int64
        description: Uptime in seconds, null if resources_valid is false
      cpu_percent:
        type: number
        format: double
        description: CPU usage in percent, null if resources_valid is false
      memory_bytes:
        type: integer
        format: int64
        description: Resident memory in bytes, null if resources_valid is false
    required:
      - id
      - path
      - args
      - auto_restart
      - restarts
      - max_restarts
      - process_id
      - runs
      - exit_code
      - exit_code_valid
      - group_name
      - group_id
      - resources_valid
  UserPasswordChangeDto:
    type: object
    properties:
      user_name:
        type: string
        example: jdoe
      old_password:
        type: string
        format: byte
        description: Current password, Base64-encoded
        example: "cGFzc3dvcmQ="
      new_password:
        type: string
        format: byte
        description: New password, Base64-encoded
        example: "bmV3cGFzc3dvcmQ="
    required:
      - user_name
      - new_password
  UserSessionDto:
    type: object
    properties:
      id:
        type: string
        description: Session id
        example: 8d4f1a2b-...
      ip_address:
        type: string
        example: 192.168.1.10
      user_name:
        type: string
        example: jdoe
      last_access:
        type: string
        format: date-time
        example: "2026-07-31T10:00:00.000000Z"
  TlsReloadResultDto:
    type: object
    description: Result of POST /admin/reload-tls, one entry per reloadable resource
    properties:
      status:
        type: string
        enum: [reloaded, failed, nothing_to_reload]
        description: Overall result of the reload
      results:
        type: object
        description: "Per-resource result: \"ok\" or \"failed: <reason>\""
        additionalProperties:
          type: string
        example:
          tls: ok
  LogLevelResultDto:
    type: object
    description: Result of POST /admin/log-level
    properties:
      status:
        type: string
        enum: [changed, invalid_level]
        description: "'changed' when the level was applied, 'invalid_level' when it was rejected"
      level:
        type: string
        description: "The level that was requested (empty for a malformed body)"
        example: debug
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Bearer token obtained via POST /user/login"
