swagger: "2.0"
info:
  title: C++ Base Library API
  version: "1.0.0"
  description: |
    REST API for the cpp-base-library.
    Authentication: obtain a bearer token via POST /user/login (HTTP Basic auth),
    then pass it as `Authorization: Bearer <token>` on subsequent requests.
host: localhost:8080
schemes:
  - http
paths:
  /history/{processName}/{serviceName}/{label}:
    get:
      summary: Get history
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: serviceName
          in: path
          required: true
          type: string
        - name: label
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /messageQueue/{processName}/{messageQueueName}:
    get:
      summary: Get message queue
      description: >
        Returns message queues matching the given name patterns as a JSON array.
        With the optional query parameters 'after' and 'limit' the result is
        keyset-paginated (ordered by queue name ascending) and returned as an
        envelope object {items, has_more, next_after}. Follow next_after to
        retrieve the next page.
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: messageQueueName
          in: path
          required: true
          type: string
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on queue name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of entries per page (default 100).
      responses:
        "200":
          description: A successful response (array of message queues, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /process/processes/{groupName}:
    get:
      summary: Get all processes
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
          description: Regex pattern to filter process groups
      responses:
        "200":
          description: A successful response
        "400":
          description: Invalid regex pattern
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /process/groups/{groupName}:
    get:
      summary: Get all process groups
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /process/start:
    post:
      summary: Start a process
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /process/stop/{processId}:
    delete:
      summary: Stop a process
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "501":
          description: Unknown process id
        "500":
          description: Internal server error
  /process/terminate/{processId}:
    delete:
      summary: Terminate a process
      security:
        - bearerAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "501":
          description: Unknown process id
        "500":
          description: Internal server error
  /shm/segments/{segmentName}:
    get:
      summary: Get all segments
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /shm/segments/shrink/{segmentName}:
    put:
      summary: Shrink a segment
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or unknown segment)
        "500":
          description: Internal server error
  /shm/segments/grow/{segmentName}/{size}:
    put:
      summary: Grow a segment
      security:
        - bearerAuth: []
      parameters:
        - name: segmentName
          in: path
          required: true
          type: string
        - name: size
          in: path
          required: true
          type: string
          description: New size in bytes
      responses:
        "200":
          description: A successful response
        "400":
          description: Unparseable size string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or unknown segment)
        "500":
          description: Internal server error
  /shm/repositories/{repositoryName}/{segmentName}:
    get:
      summary: Get all repositories
      security:
        - bearerAuth: []
      parameters:
        - name: repositoryName
          in: path
          required: true
          type: string
          description: Regex pattern to filter repository names
        - name: segmentName
          in: path
          required: true
          type: string
          description: Regex pattern to filter segment names
      responses:
        "200":
          description: A successful response
        "400":
          description: Invalid regex pattern
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /shm/repository/{uuid}:
    get:
      summary: Export a repository
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "404":
          description: Unknown repository UUID
        "500":
          description: Internal server error
  /user/login:
    post:
      summary: User login
      description: |
        Authenticate via HTTP Basic auth (base64-encoded user:password).
        Returns a UserDto with the bearer token on success.
        Passes must NOT hold a valid bearer token already.
      parameters:
        - name: Authorization
          in: header
          required: true
          type: string
          description: "Basic base64(user:password)"
      responses:
        "200":
          description: A successful response (UserDto JSON)
        "403":
          description: Invalid credentials, already logged in, or malformed Basic header
        "500":
          description: Internal server error
  /user/logout:
    delete:
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
  /user/state:
    get:
      summary: Get user login state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response (empty body)
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
  /user/groups:
    get:
      summary: Get all groups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/groups/{groupNameOrIsVirtual}:
    get:
      summary: Get all groups by name or virtual flag
      security:
        - bearerAuth: []
      parameters:
        - name: groupNameOrIsVirtual
          in: path
          required: true
          type: string
          description: Group name or "true"/"false" for virtual filter
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/groups/{groupName}/{isVirtual}:
    get:
      summary: Get all groups by name and virtual flag
      security:
        - bearerAuth: []
      parameters:
        - name: groupName
          in: path
          required: true
          type: string
        - name: isVirtual
          in: path
          required: true
          type: boolean
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/users:
    get:
      summary: Get all users
      description: >
        Returns all users as a JSON array. With the optional query parameters
        'after' and 'limit' the result is keyset-paginated (ordered by
        user_name ascending) and returned as an envelope object
        {items, has_more, next_after}. Follow next_after to retrieve the next page.
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on user_name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of users per page (default 100).
      responses:
        "200":
          description: A successful response (array of users, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/users/{userName}:
    get:
      summary: Get all users by user name
      description: >
        Filters users by a regular expression on user_name. Supports the same
        optional keyset-paging parameters ('after', 'limit') as /user/users;
        when paging is active the response is the envelope object
        {items, has_more, next_after}.
      security:
        - bearerAuth: []
      parameters:
        - name: userName
          in: path
          required: true
          type: string
        - name: after
          in: query
          required: false
          type: string
          description: Exclusive lower bound on user_name; use next_after of the previous page.
        - name: limit
          in: query
          required: false
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of users per page (default 100).
      responses:
        "200":
          description: A successful response (array of users, or paging envelope when after/limit is given)
        "400":
          description: Bad request (invalid limit)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/add:
    post:
      summary: Add a user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "406":
          description: Not Acceptable (missing password)
        "500":
          description: Internal server error
  /user/update:
    put:
      summary: Update a user (group membership)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or unknown target user)
        "500":
          description: Internal server error
  /user/delete:
    delete:
      summary: Delete users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type or self-delete attempt)
        "500":
          description: Internal server error
  /user/password:
    put:
      summary: Change the password of a user
      description: |
        Self-service requires the current (old) password, an admin may omit it.
        Passwords are transmitted Base64-encoded.
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/UserPasswordChangeDto"
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (empty/unknown username, wrong old password, wrong content type)
        "406":
          description: Not Acceptable (empty new password)
        "500":
          description: Internal server error
  /user/sessions:
    get:
      summary: Get all active sessions of the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A successful response
          schema:
            type: array
            items:
              $ref: "#/definitions/UserSessionDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /user/sessions/{sessionId}:
    delete:
      summary: Revoke an active session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized (no token, wrong group, or revoking foreign session as non-admin)
        "500":
          description: Internal server error
  /properties/{processName}/{className}/{instanceName}:
    get:
      summary: Get all properties
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
    put:
      summary: Update a property
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "500":
          description: Internal server error
  /properties/{processName}/{className}/{instanceName}/{propertyName}:
    get:
      summary: Get a property
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
        - name: propertyName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "405":
          description: Property not found
        "500":
          description: Internal server error
    put:
      summary: Update a property
      security:
        - bearerAuth: []
      parameters:
        - name: processName
          in: path
          required: true
          type: string
        - name: className
          in: path
          required: true
          type: string
        - name: instanceName
          in: path
          required: true
          type: string
        - name: propertyName
          in: path
          required: true
          type: string
      responses:
        "200":
          description: A successful response
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (wrong content type)
        "405":
          description: Property not found, no runtime change support, or bad value
        "500":
          description: Internal server error
definitions:
  UserPasswordChangeDto:
    type: object
    properties:
      user_name:
        type: string
        example: jdoe
      old_password:
        type: string
        format: byte
        description: Current password, Base64-encoded
        example: "cGFzc3dvcmQ="
      new_password:
        type: string
        format: byte
        description: New password, Base64-encoded
        example: "bmV3cGFzc3dvcmQ="
    required:
      - user_name
      - new_password
  UserSessionDto:
    type: object
    properties:
      id:
        type: string
        description: Session id
        example: 8d4f1a2b-...
      ip_address:
        type: string
        example: 192.168.1.10
      user_name:
        type: string
        example: jdoe
      last_access:
        type: string
        format: date-time
        example: "2026-07-31T10:00:00.000000Z"
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Bearer token obtained via POST /user/login"
