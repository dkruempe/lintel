services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  builder:
    build:
      context: .
      target: builder
    image: cpp-base-library:latest
    profiles:
      - build

  test:
    build:
      context: .
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_DIRECTORY: /workspace/cfg
    profiles:
      - test

  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_DIRECTORY: /workspace/cfg
    ports:
      - "8080:8080"
    profiles:
      - app

volumes:
  postgres_data:
