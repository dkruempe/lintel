services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev:
    build:
      context: .
      target: base
    image: cpp-base-library:dev
    profiles:
      - dev
    volumes:
      - .:/workspace
      - conan_cache:/root/.conan2
      - build_cache:/workspace/build
    working_dir: /workspace
    command: >
      bash -c "conan profile detect --force &&
      conan install . --output-folder=build --build=missing -s build_type=Release &&
      cmake -S . -B build/build/Release
      -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake
      -DCMAKE_BUILD_TYPE=Release &&
      cmake --build build/build/Release --parallel $(nproc)"

  test:
    build:
      context: .
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_DIRECTORY: /workspace/cfg
    profiles:
      - test

  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_DIRECTORY: /workspace/cfg
    ports:
      - "8080:8080"
    profiles:
      - app

volumes:
  postgres_data:
  conan_cache:
  build_cache:
