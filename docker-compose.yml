# Development/test compose file.
#
# Everything here is a DEVELOPMENT DEFAULT and is NOT production-safe:
#   * postgres is published on the host with the trivial credentials test/test/test,
#   * the app serves the HTTP API over HTTPS with a self-signed development certificate.
# For production: use real credentials (do not publish 5432), keep
# require_tls="true" in cfg/bootstrap.xml and point cert_path/key_path at real
# certificates instead of the self-signed cfg/certs/ pair.
services:
  postgres:
    image: postgres:17
    # DEV/TEST ONLY: user/password/db are all "test" and the port is published
    # to 0.0.0.0:5432, so the database is world-reachable with guessable
    # credentials. Inject a real secret (e.g. ${POSTGRES_PASSWORD}) and drop the
    # ports mapping for anything but local development.
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dev:
    build:
      context: .
      target: base
    image: lintel:dev
    profiles:
      - dev
    environment:
      CCACHE_BASEDIR: /workspace
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 500M
    volumes:
      - .:/workspace
      - conan_cache:/root/.conan2
      - build_cache:/workspace/build
      - ccache_cache:/root/.ccache
    working_dir: /workspace
    command: >
      bash -c "conan profile detect --force &&
      conan install . --output-folder=build --build=missing -s build_type=Release &&
      cmake -S . -B build/build/Release
      -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake
      -DCMAKE_BUILD_TYPE=Release &&
      cmake --build build/build/Release --parallel $(nproc)"

  test:
    build:
      context: .
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_DIRECTORY: /workspace/cfg
    profiles:
      - test

  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # cfg/ is copied into the runtime image (see Dockerfile) and cfg/bootstrap.xml
      # sets require_tls="true", so ./bin/main serves HTTPS on 8080 using the
      # self-signed dev certificates in cfg/certs/. Development default only:
      # production must supply real certificates and real database credentials.
      CONFIG_DIRECTORY: /workspace/cfg
    ports:
      - "8080:8080"
    healthcheck:
      # Unauthenticated liveness endpoint (GET /health, see
      # src/features/http/service/Server.cpp). The server is HTTPS because
      # cfg/bootstrap.xml has require_tls="true"; -k skips verification of the
      # self-signed development certificate. curl is installed in the runtime
      # stage (Dockerfile) for exactly this check.
      test: ["CMD", "curl", "-fsSk", "https://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    profiles:
      - app

volumes:
  postgres_data:
  conan_cache:
  build_cache:
  ccache_cache:
