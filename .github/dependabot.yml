# Dependabot keeps the GitHub Actions and the container base image current.
# Conan is not a Dependabot ecosystem — dependency updates for conanfile.txt are
# done manually (see ROADMAP §5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR for all action updates instead of one per action.
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
      - ci
