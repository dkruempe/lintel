name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (cpp, security-and-quality, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # 'none'    - fast, no build. This is what produced the 33 open alerts.
        # 'manual'  - instrumented build (GitHub renamed this mode; 'full' is
        #             rejected with "Supported build modes are: none, autobuild,
        #             manual"). ~30 min warm. Advisory only for now.
        include:
          - mode: none
            blocking: true
          - mode: manual
            blocking: false

    # The instrumented build takes ~30 min. It must not turn master red while
    # the two modes are being compared, but it must not be invisible either -
    # a failed run that nobody reads is worse than a red one.
    continue-on-error: ${{ !matrix.blocking }}

    env:
      CC: gcc
      CXX: g++
      BUILD_DIR: build/build/Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 'manual' compiles the whole dependency graph from source (Boost, OpenSSL,
      # libpq), so without this the cache is cold on every single run.
      - name: Cache Conan packages
        if: ${{ matrix.mode == 'manual' }}
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-codeql-manual-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-codeql-manual-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality
          build-mode: ${{ matrix.mode }}
          config: |
            # `paths-ignore`, not `paths`. The `paths` key does not restrict what
            # is scanned - it was in the config since 04.10.2026 and changed
            # nothing, which is why the instrumented build reported 90 findings
            # inside build/**/Unity/unity_*_cxx.cxx: CMake-generated amalgamation
            # files that include .cpp files. The rule cpp/include-non-header
            # fires on exactly those lines.
            #
            # build/  - generated by the instrumented build of this workflow
            # external/ - vendored Hypodermic, not ours to fix; a finding there
            #             is reported against upstream, see THIRD_PARTY_NOTICES.md
            paths-ignore:
              - build
              - external

      # Full instrumented build: resolves macro/constexpr/template contexts
      # across translation-unit boundaries. Without a compilation database
      # CodeQL falls back to heuristic extraction, which is why 'none' reports
      # findings at lines that do not contain the reported construct at all
      # (see docs/code-scanning.md).
      - name: Set up build tools
        if: ${{ matrix.mode == 'manual' }}
        # Hard backstop above install-deps.sh's own budget. A throttled mirror
        # node must not be killed and restarted here (see AGENTS.md).
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential cmake ninja-build ccache \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install dependencies with Conan (manual build only)
        if: ${{ matrix.mode == 'manual' }}
        run: |
          pipx install 'conan>=2.0,<3.0'
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake (manual build only)
        if: ${{ matrix.mode == 'manual' }}
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      - name: Build (manual build only)
        if: ${{ matrix.mode == 'manual' }}
        run: cmake --build "$BUILD_DIR" --parallel "$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4