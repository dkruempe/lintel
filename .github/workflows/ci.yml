name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Superseded runs on the same ref are pointless (every job pays for a Conan build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CONAN_SYSREQUIRES_MODE: enabled
  # Keeps object paths independent of the runner workspace -> cross-run cache hits.
  CCACHE_BASEDIR: ${{ github.workspace }}
  # ccache >= 4 defaults to ~/.cache/ccache, so the cache action must point at the
  # same explicit directory. Without this the cache path never existed (no-op).
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: "500M"
  # `content` instead of mtime: runner images change compiler mtimes, which would
  # silently invalidate every cached object file.
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      # One broken matrix entry must not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          # gate: what we release from
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
            unity: ON
          # second opinion on the compiler, catches GCC-specific behaviour
          - name: clang-release
            cc: clang-18
            cxx: clang++-18
            build_type: Release
            unity: ON
          # Debug build + non-unity in one run: catches unity-masked missing includes
          - name: gcc-debug-nonunity
            cc: gcc
            cxx: g++
            build_type: Debug
            unity: OFF

    services:
      # Ready for the [pg] tests that are still missing.
      # Credentials match docker-compose.yml.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/build/${{ matrix.build_type }}
      # Part of every cache key: packages and object files are only interchangeable
      # within the same compiler/build-type/unity combination.
      CACHE_ID: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      # ── Conan cache (Boost/openssl/libpq come from source otherwise) ────
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      # ── ccache (object-file cache) ─────────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'conanfile.txt', 'src/**', 'tests/**', 'examples/**', 'external/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CACHE_ID }}-

      # ── System-Dependencies ────────────────────────────────────────────
      # scripts/install-deps.sh instead of a bare apt-get: retries the mirror,
      # waits out the dpkg lock and fails after APT_BUDGET seconds instead of
      # hanging until the job timeout.
      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential cmake ninja-build ccache \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      # The TLS integration test needs certs/server.crt + certs/server.key. Both
      # are generated (and git-ignored) since the private key was removed from the
      # repository, so every job creates its own throwaway pair.
      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      # The profile is derived from CC/CXX, so the Clang entry gets a Clang
      # profile. Do not override single settings here: host and build context have
      # to stay identical, otherwise Conan computes two package IDs per dependency.
      - name: Configure Conan profile
        run: |
          conan profile detect --force
          conan profile show

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # ── Build ──────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_UNITY_BUILD=${{ matrix.unity }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        env:
          # A missing postgres service must fail the job, not turn the ten
          # [pg] tests into ctest skips - see requirePg() in
          # tests/integration/PostgreSqlIntegrationTest.cpp.
          LINTEL_REQUIRE_PG: "1"
        run: ctest --output-on-failure --label-regex unit

      # ── ccache hit rate ───────────────────────────────────────────────
      # The roadmap target is > 70 % hits; CCACHE_BASEDIR makes paths
      # independent of the runner workspace.
      - name: ccache statistics
        if: always()
        run: |
          {
            echo '## ccache (${{ matrix.name }})'
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: sanitizers (ASan+UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Advisory for now. Two known reasons it cannot be blocking yet:
    #   - LSan is switched off (see below): the static spdlog registry,
    #     boost::interprocess segments and the fork() in the signal test produce
    #     leaks that are not bugs in this library.
    #   - Budget: on a private repository the Actions minutes are limited
    #     (2000/month), and this job costs roughly 8-10 minutes per run.
    # Promote to blocking once a full run is green and LSan is investigated.
    continue-on-error: true

    env:
      CC: clang-18
      CXX: clang++-18
      BUILD_TYPE: RelWithDebInfo
      BUILD_DIR: build/build/RelWithDebInfo
      CACHE_ID: sanitizers
      CONAN_SYSREQUIRES_MODE: enabled

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential cmake ninja-build pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake with sanitizers
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/RelWithDebInfo/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -G Ninja

      # The TLS integration test needs certs/server.crt + certs/server.key. Both are
      # generated and git-ignored, so this job creates its own throwaway pair.
      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run tests
        env:
          # LSan off: the static spdlog registry, the boost::interprocess
          # segments and the fork() in the signal test all look like leaks and
          # would drown out a real finding. halt_on_error=1 makes ASan and
          # UBSan stop at the first real error instead of continuing.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # Same reason as in the build job - see requirePg().
          LINTEL_REQUIRE_PG: "1"
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure --label-regex unit

  secrets:
    name: secret guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Blocking, and cheap (no compiler involved). This exists because
      # `secret_scanning_push_protection` cannot be enabled for this repository
      # via the API - every field in `security_and_analysis` is rejected with
      # 422, even with admin rights (verified 2026-10-06). Until that is enabled
      # in the UI under Settings -> Code security, this job is the guard.
      - name: Check for plaintext credentials
        run: ./scripts/check-secrets.sh --all

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # the check diffs against the base commit, so we need its history
          fetch-depth: 0

      - name: Install clang-format
        # Hard backstop above install-deps.sh's own budget. This step needs only
        # a few MB, and the job timeout is 15 min.
        timeout-minutes: 12
        run: |
          ./scripts/install-deps.sh clang-format-18
          clang-format-18 --version

      - name: Baseline ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=$PUSH_BEFORE" >> "$GITHUB_ENV"
          fi

      # Blocking: a change must not add new formatting violations to the files it
      # touches. Legacy violations are tolerated, the whole repo is not reformatted.
      - name: Check formatting of changed files
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
          CLANG_FORMAT: clang-format-18
        run: ./scripts/check-format.sh "$BASE_REF"

      # Advisory: how far the repo is from `make format`-clean, to size up the
      # remaining reformat work.
      - name: Report repo-wide formatting drift
        if: always()
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
          CLANG_FORMAT: clang-format-18
        run: ./scripts/check-format.sh --all

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Advisory: existing findings (e.g. in ProcessService.cpp) would turn every
    # PR that touches them red. Becomes blocking once those are cleaned up.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-tidy-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-tidy-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential clang-tidy-18 cmake ninja-build \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # Configure only, no build: compile_commands.json exists after configure, and
      # unity/PCH would make it unusable for per-file clang-tidy.
      - name: Configure CMake (non-unity, no PCH)
        run: |
          cmake -S . -B build/tidy \
            -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_UNITY_BUILD=OFF \
            -DENABLE_PCH=OFF \
            -G Ninja

      - name: Baseline ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=$PUSH_BEFORE" >> "$GITHUB_ENV"
          fi

      - name: Run clang-tidy on changed files
        env:
          CLANG_TIDY: clang-tidy-18
          TIDY_MAX_FILES: "20"
          SUMMARY_FILE: ${{ github.step_summary }}
        run: ./scripts/check-tidy.sh "$BASE_REF" build/tidy
