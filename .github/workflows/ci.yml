name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  CONAN_SYSREQUIRES_MODE: enabled
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: "500M"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # ── Conan cache (1.5 GB, ~15 min sparen) ──────────────────────
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # ── ccache (Objekt-File-Cache) ────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'conanfile.txt', 'src/**', 'tests/**', 'examples/**', 'external/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ── System-Dependencies ────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build ccache \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Configure Conan profile
        run: conan profile detect --force

      # ── Conan Install (nur wenn conanfile.txt geändert) ───────────
      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # ── Build ──────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B build/build/Release \
            -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      - name: Build
        run: cmake --build build/build/Release --parallel $(nproc)

      # ── Tests ──────────────────────────────────────────────────────
      - name: Run tests
        working-directory: build/build/Release
        run: ctest --output-on-failure --label-regex unit

      # ── ccache stats ───────────────────────────────────────────────
      - name: ccache stats
        run: ccache -s
