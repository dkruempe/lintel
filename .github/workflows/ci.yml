name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            make \
            python3-pip \
            python3-venv \
            libpq-dev \
            libsqlite3-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - name: Install Conan
        run: pip3 install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-${{ hashFiles('conanfile.txt') }}
            ${{ runner.os }}-conan-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies via Conan
        run: conan install . --output-folder=build --build=missing -s build_type=Release -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake
        run: cmake --preset conan-release -DMYPROJECT_ENABLE_CLANG_TIDY=OFF

      - name: Build
        run: cmake --build --preset conan-release --parallel 8
        env:
          CCACHE_DIR: ~/.ccache

      - name: Run tests
        run: ctest --preset conan-release --output-on-failure
