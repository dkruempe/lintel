name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Superseded runs on the same ref are pointless (every job pays for a Conan build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CONAN_SYSREQUIRES_MODE: enabled
  # Keeps object paths independent of the runner workspace -> cross-run cache hits.
  CCACHE_BASEDIR: ${{ github.workspace }}
  # ccache >= 4 defaults to ~/.cache/ccache, so the cache action must point at the
  # same explicit directory. Without this the cache path never existed (no-op).
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: "500M"
  # `content` instead of mtime: runner images change compiler mtimes, which would
  # silently invalidate every cached object file.
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      # One broken matrix entry must not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          # gate: what we release from
          - name: gcc-release
            cc: gcc-14
            cxx: g++-14
            build_type: Release
            unity: ON
          # second opinion on the compiler, catches GCC-specific behaviour
          - name: clang-release
            cc: clang-18
            cxx: clang++-18
            build_type: Release
            unity: ON
          # Debug build + non-unity in one run: catches unity-masked missing includes
          - name: gcc-debug-nonunity
            cc: gcc-14
            cxx: g++-14
            build_type: Debug
            unity: OFF

    services:
      # Ready for the [pg] tests that are still missing.
      # Credentials match docker-compose.yml.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIR: build/build/${{ matrix.build_type }}
      # Part of every cache key: packages and object files are only interchangeable
      # within the same compiler/build-type/unity combination.
      CACHE_ID: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      # ── Conan cache (Boost/openssl/libpq come from source otherwise) ────
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      # ── ccache (object-file cache) ─────────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'conanfile.txt', 'src/**', 'tests/**', 'examples/**', 'external/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CACHE_ID }}-

      # ── System-Dependencies ────────────────────────────────────────────
      # scripts/install-deps.sh instead of a bare apt-get: retries the mirror,
      # waits out the dpkg lock and fails after APT_BUDGET seconds instead of
      # hanging until the job timeout.
      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 cmake ninja-build ccache \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      # The TLS integration test needs certs/server.crt + certs/server.key. Both
      # are generated (and git-ignored) since the private key was removed from the
      # repository, so every job creates its own throwaway pair.
      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      # The profile is derived from CC/CXX, so the Clang entry gets a Clang
      # profile. Do not override single settings here: host and build context have
      # to stay identical, otherwise Conan computes two package IDs per dependency.
      - name: Configure Conan profile
        run: |
          conan profile detect --force
          conan profile show

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # ── Build ──────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_UNITY_BUILD=${{ matrix.unity }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        env:
          # A missing postgres service must fail the job, not turn the ten
          # [pg] tests into ctest skips - see requirePg() in
          # tests/integration/PostgreSqlIntegrationTest.cpp.
          LINTEL_REQUIRE_PG: "1"
        run: ctest --output-on-failure --label-regex unit

      # ── ccache hit rate ───────────────────────────────────────────────
      # The roadmap target is > 70 % hits; CCACHE_BASEDIR makes paths
      # independent of the runner workspace.
      - name: ccache statistics
        if: always()
        run: |
          {
            echo '## ccache (${{ matrix.name }})'
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Cross-platform (advisory) ─────────────────────────────────────────────
  # macOS and Windows are built from the same sources but cannot be verified on
  # a Linux box, so both jobs are advisory (continue-on-error) until a full run
  # is green on a real runner. They do NOT set LINTEL_REQUIRE_PG: there is no
  # `services:` container on these runners, so the PostgreSQL integration tests
  # skip instead of failing.
  macos:
    name: build (macos)
    runs-on: macos-latest
    timeout-minutes: 150

    # Advisory - see the cross-platform comment above. Promote to blocking once
    # the run is stable; the code paths are already shared with the Linux jobs.
    continue-on-error: true

    env:
      BUILD_TYPE: Release
      BUILD_DIR: build/build/Release
      CACHE_ID: macos
      CONAN_SYSREQUIRES_MODE: enabled

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      # Xcode ships the toolchain; Conan builds boost/openssl/libpq from source
      # (no apt on macOS), so the run is slower than the Linux gate.
      - name: Install build tools
        run: |
          brew install ninja || true
          ninja --version
          cmake --version
          ccache --version || true

      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Install Conan
        run: pip3 install --break-system-packages --no-cache-dir conan

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -G Ninja

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(sysctl -n hw.ncpu)

      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --label-regex unit

  windows:
    name: build (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 180

    # Advisory - see the cross-platform comment above.
    continue-on-error: true

    env:
      BUILD_TYPE: Release
      BUILD_DIR: build/build/Release
      CACHE_ID: windows
      CONAN_SYSREQUIRES_MODE: enabled

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      # Conan needs the MSVC environment (cl.exe / link.exe on PATH) to build
      # the C++ dependencies from source and to compile the project with Ninja.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # Ninja and CMake ship with the runner image; the pip fallback keeps the
      # job working if the image changes underneath us.
      - name: Ensure build tools
        shell: bash
        run: |
          command -v cmake && cmake --version
          if ! command -v ninja >/dev/null 2>&1; then
            python -m pip install --no-cache-dir ninja
          fi
          ninja --version

      - name: Generate TLS test certificates
        shell: bash
        run: ./cfg/certs/generate_certs.sh

      - name: Install Conan
        shell: bash
        run: python -m pip install --no-cache-dir conan

      - name: Install Conan dependencies
        shell: bash
        run: |
          conan profile detect --force
          # MSVC has no default -std flag, so profile detect reports cppstd=14
          # and conan rejects magic_enum/benchmark (need >= 17). The project
          # builds C++20 (target_compile_features), so pin the profile to 20.
          #
          # The image's MSVC (compiler.version=195 / VS 2026) is newer than any
          # ABI ConanCenter ships, so every dependency would be built from
          # source. Pin the *dependency* compiler to the newest version with
          # binaries (194) - MSVC is binary compatible across 19.4x/19.5x, and
          # the project itself is still compiled by the real cl.exe.
          #
          # Pinning 194 also makes Conan resolve the VS installation as "Visual
          # Studio 17" (msvc 194 -> VS 17) whenever it writes the vcvars wrapper
          # for a Ninja build. The image only has VS 18 (2026), so the one
          # dependency without a matching binary (catch2) fails while building
          # from source. Point the wrapper at the installation that exists.
          #
          # cppstd=20 also turns on Boost.Cobalt, whose cobalt_io_ssl component
          # needs OpenSSL and is not built by the recipe here - package_info()
          # then aborts with "libboost_cobalt_io_ssl ... not built". lintel does
          # not use Boost.Cobalt, so switch the component off.
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -s compiler.cppstd=20 \
            -s compiler.version=194 \
            -o "boost/*:without_cobalt=True" \
            -c tools.microsoft.msbuild:vs_version=18 \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake
        shell: bash
        run: |
          # The image ships a MinGW cppcheck (via Strawberry Perl) that cannot
          # load its own std.cfg, so it fails every compile with
          # --error-exitcode=2. Keep the analyzer on elsewhere; the Windows job
          # is not the place to fight a broken install.
          cmake -S . -B "${{ env.BUILD_DIR }}" \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLINTEL_ENABLE_CPPCHECK=OFF \
            -G Ninja

      - name: Build
        shell: bash
        run: cmake --build "${{ env.BUILD_DIR }}" --parallel

      - name: Run tests
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --label-regex unit

  sanitizers:
    name: sanitizers (ASan+UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Advisory for now. Two known reasons it cannot be blocking yet:
    #   - LSan is switched off (see below): the static spdlog registry,
    #     boost::interprocess segments and the fork() in the signal test produce
    #     leaks that are not bugs in this library.
    #   - Budget: on a private repository the Actions minutes are limited
    #     (2000/month), and this job costs roughly 8-10 minutes per run.
    # Promote to blocking once a full run is green and LSan is investigated.
    continue-on-error: true

    env:
      CC: clang-18
      CXX: clang++-18
      BUILD_TYPE: RelWithDebInfo
      BUILD_DIR: build/build/RelWithDebInfo
      CACHE_ID: sanitizers
      CONAN_SYSREQUIRES_MODE: enabled

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 cmake ninja-build pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake with sanitizers
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/RelWithDebInfo/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -G Ninja

      # The TLS integration test needs certs/server.crt + certs/server.key. Both are
      # generated and git-ignored, so this job creates its own throwaway pair.
      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run tests
        env:
          # LSan off: the static spdlog registry, the boost::interprocess
          # segments and the fork() in the signal test all look like leaks and
          # would drown out a real finding. halt_on_error=1 makes ASan and
          # UBSan stop at the first real error instead of continuing.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # Same reason as in the build job - see requirePg().
          LINTEL_REQUIRE_PG: "1"
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure --label-regex unit

  tsan:
    name: sanitizers (TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Blocking since 13.10.2026: a full green run exists (663/663 tests, no
    # ThreadSanitizer findings). The previous 121 SIGSEGVs were not data races
    # but glibc's getaddrinfo_a helper thread, which is invisible to GCC-14
    # TSan; disabled with cpp-httplib's use_non_blocking_getaddrinfo=False.
    continue-on-error: false

    env:
      # GCC's TSan is the mature implementation; Clang's runtime is not used
      # here on purpose.
      CC: gcc-14
      CXX: g++-14
      BUILD_TYPE: RelWithDebInfo
      BUILD_DIR: build/build/tsan
      CACHE_ID: tsan
      CONAN_SYSREQUIRES_MODE: enabled

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 cmake ninja-build pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          # cpp-httplib's default use_non_blocking_getaddrinfo=True selects glibc's
          # getaddrinfo_a, whose internal resolver worker thread GCC's TSan does not
          # instrument: the first malloc on it crashes in TSan's allocator (no data
          # race). Force the thread-based resolver for this job only.
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -o 'cpp-httplib/*:use_non_blocking_getaddrinfo=False' \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake with ThreadSanitizer
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -G Ninja

      # The TLS integration test needs certs/server.crt + certs/server.key. Both
      # are generated and git-ignored, so this job creates its own throwaway pair.
      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        env:
          # halt_on_error: stop at the first real data race instead of continuing.
          # second_deadlock_stack: include the second stack in lock-order findings.
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          # A missing postgres service must fail the job, not turn the [pg] tests
          # into ctest skips - see requirePg().
          LINTEL_REQUIRE_PG: "1"
        run: ctest --output-on-failure --label-regex unit

  benchmarks:
    name: benchmarks (runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Advisory: the runtime numbers are tracked as an artifact, not gated. They
    # are noisy on shared runners, so a regression must be reviewed by a human.
    continue-on-error: true

    env:
      CC: gcc-14
      CXX: g++-14
      BUILD_TYPE: Release
      BUILD_DIR: build/build/Release
      CACHE_ID: benchmarks
      CONAN_SYSREQUIRES_MODE: enabled

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'conanfile.txt', 'src/**', 'benchmarks/**', 'external/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 cmake ninja-build ccache \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure CMake (benchmarks)
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      # Only the benchmark target: the tests are exercised by the build job, so
      # this job does not pay for compiling them again.
      - name: Build benchmarks
        run: cmake --build ${{ env.BUILD_DIR }} --target base_benchmarks --parallel $(nproc)

      - name: Generate development certificate pair
        # the TLS benchmarks read cfg/certs/server.{crt,key} and report "skipped"
        # without it; the file is git-ignored, so CI has to create it
        run: ./cfg/certs/generate_certs.sh

      # One run, two outputs: the table for the log and the JSON for the baseline
      # comparison. Best effort - a benchmark crash must not skip the upload or
      # the comparison, so this step keeps the job advisory.
      - name: Run benchmarks
        continue-on-error: true
        run: |
          timeout 20m ./bin/base_benchmarks \
            --benchmark_min_time=0.2s \
            --benchmark_repetitions=3 \
            --benchmark_report_aggregates_only=true \
            --benchmark_format=console \
            --benchmark_out=benchmark_results.json \
            --benchmark_out_format=json

      # Advisory for now (see ROADMAP.md P2): the comparison uses a
      # geometric-mean-normalized index, which cancels the machine-wide speed
      # factor, but shared runners are still noisy. Promote to a blocker by
      # removing continue-on-error once the numbers are stable.
      - name: Compare with the baseline
        continue-on-error: true
        run: ./scripts/check-benchmarks.sh --threshold 10 benchmark_results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark_results.json
          if-no-files-found: warn

  coverage:
    name: coverage (gcov/lcov)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Coverage should meet target (90%) once established.
    continue-on-error: false

    env:
      CC: gcc-14
      CXX: g++-14
      BUILD_TYPE: Debug
      BUILD_DIR: build/build/Debug
      CACHE_ID: coverage
      CONAN_SYSREQUIRES_MODE: enabled

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'conanfile.txt', 'src/**', 'tests/**', 'examples/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 cmake ninja-build ccache \
            pkg-config python3 python3-pip lcov \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # Debug keeps -g -O0, so line coverage is accurate: optimised builds
      # inline code away and skew the report.
      - name: Configure CMake with coverage
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        env:
          # A missing postgres service must fail the job - see requirePg().
          LINTEL_REQUIRE_PG: "1"
        run: ctest --output-on-failure --label-regex unit

      - name: Build coverage report
        env:
          GCOV: gcov-14
          SUMMARY_FILE: ${{ github.step_summary }}
        run: ./scripts/coverage-report.sh ${{ env.BUILD_DIR }} coverage

      - name: Upload coverage to Codecov
        # Requires the repository `CODECOV_TOKEN` secret (Settings -> Secrets and
        # variables -> Actions). Advisory like the rest of the job: a failed
        # upload never fails CI. `use_oidc: true` is the tokenless alternative.
        uses: codecov/codecov-action@v7
        with:
          files: coverage/coverage.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  fuzz:
    name: fuzzing (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Advisory: each harness runs for a bounded time on every run. A finding
    # (crash / sanitizer error) is uploaded as an artifact and should be reviewed
    # by a human; the job is promoted to blocking once the parsers stay quiet.
    continue-on-error: true

    env:
      CC: clang-18
      CXX: clang++-18
      BUILD_TYPE: RelWithDebInfo
      BUILD_DIR: build/fuzz
      CACHE_ID: fuzz
      CONAN_SYSREQUIRES_MODE: enabled

    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.CACHE_ID }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'conanfile.txt', 'src/**', 'fuzz/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CACHE_ID }}-

      - name: Install system dependencies
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 clang-18 cmake ninja-build ccache \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Generate TLS test certificates
        run: ./cfg/certs/generate_certs.sh

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=${{ env.BUILD_TYPE }} \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # fuzzer-no-link instruments the whole library with libFuzzer's coverage
      # feedback (without pulling in its main()); the fuzz targets themselves add
      # -fsanitize=fuzzer. ASan catches memory errors the harnesses reach.
      - name: Configure CMake with sanitizers and fuzzers
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_TOOLCHAIN_FILE=build/build/${{ env.BUILD_TYPE }}/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_FUZZERS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja

      - name: Build fuzzers
        run: |
          cmake --build ${{ env.BUILD_DIR }} \
            --target fuzz_config_env fuzz_json_dto fuzz_property_xml \
            --parallel $(nproc)

      - name: Run fuzzers
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=0
        run: |
          set -euo pipefail
          run_fuzzer() {
            local target="$1" corpus="$2"
            mkdir -p "fuzz-artifacts/$target"
            echo "::group::$target (corpus: fuzz/corpus/$corpus)"
            "./bin/$target" "fuzz/corpus/$corpus" \
              -max_total_time=90 \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -artifact_prefix="fuzz-artifacts/$target/" \
              -print_final_stats=1
            echo "::endgroup::"
          }
          run_fuzzer fuzz_config_env config_env
          run_fuzzer fuzz_json_dto json_dto
          run_fuzzer fuzz_property_xml property_xml

      - name: Upload fuzzing artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzzing-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  secrets:
    name: secret guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Blocking, and cheap (no compiler involved). This exists because
      # `secret_scanning_push_protection` cannot be enabled for this repository
      # via the API - every field in `security_and_analysis` is rejected with
      # 422, even with admin rights (verified 2026-10-06). Until that is enabled
      # in the UI under Settings -> Code security, this job is the guard.
      - name: Check for plaintext credentials
        run: ./scripts/check-secrets.sh --all

  namespace:
    name: namespace guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Blocking, and cheap (no compiler involved). The public API moved into
      # `namespace lintel` (A1 migration); this guard fails when a header
      # declares its own names at global scope again, which would reintroduce
      # the collisions the migration removed. The generated `config.h` is exempt.
      - name: Check public header namespaces
        run: ./scripts/check-namespace.sh

  swagger:
    name: swagger lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Blocking, and cheap. swagger.yaml is the wire-contract source of truth;
      # the configured version check in CMakeLists.txt only covers info.version,
      # while this job also catches dangling $refs, operations without responses,
      # undeclared security schemes and a stale swagger.md mirror.
      - name: Install YAML support
        timeout-minutes: 12
        run: |
          ./scripts/install-deps.sh python3 python3-yaml
          pip3 install swagger-spec-validator --break-system-packages --no-cache-dir

      - name: Lint the API specification
        run: ./scripts/check-swagger.sh

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # the check diffs against the base commit, so we need its history
          fetch-depth: 0

      - name: Install clang-format
        # Hard backstop above install-deps.sh's own budget. This step needs only
        # a few MB, and the job timeout is 15 min.
        timeout-minutes: 12
        run: |
          ./scripts/install-deps.sh clang-format-18
          clang-format-18 --version

      - name: Baseline ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=$PUSH_BEFORE" >> "$GITHUB_ENV"
          fi

      # Blocking: a change must not add new formatting violations to the files it
      # touches. Legacy violations are tolerated, the whole repo is not reformatted.
      - name: Check formatting of changed files
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
          CLANG_FORMAT: clang-format-18
        run: ./scripts/check-format.sh "$BASE_REF"

      # Advisory: how far the repo is from `make format`-clean, to size up the
      # remaining reformat work.
      - name: Report repo-wide formatting drift
        if: always()
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
          CLANG_FORMAT: clang-format-18
        run: ./scripts/check-format.sh --all

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Advisory: existing findings (e.g. in ProcessService.cpp) would turn every
    # PR that touches them red. Becomes blocking once those are cleaned up.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-tidy-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-tidy-

      - name: Install system dependencies
        # Hard backstop above install-deps.sh's own 30 min budget: cmake is
        # ~11 MB and runners occasionally get a mirror throttled to ~12 kB/s,
        # which takes ~16 min and must NOT be killed and restarted.
        timeout-minutes: 40
        run: |
          ./scripts/install-deps.sh \
            build-essential g++-14 clang-tidy-18 cmake ninja-build \
            pkg-config python3 python3-pip \
            libpq-dev libsqlite3-dev libssl-dev

      - name: Install Conan
        run: pip3 install conan --break-system-packages --no-cache-dir

      - name: Install Conan dependencies
        run: |
          conan profile detect --force
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      # Configure only, no build: compile_commands.json exists after configure, and
      # unity/PCH would make it unusable for per-file clang-tidy.
      - name: Configure CMake (non-unity, no PCH)
        run: |
          cmake -S . -B build/tidy \
            -DCMAKE_TOOLCHAIN_FILE=build/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_UNITY_BUILD=OFF \
            -DENABLE_PCH=OFF \
            -G Ninja

      - name: Baseline ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=$PUSH_BEFORE" >> "$GITHUB_ENV"
          fi

      - name: Run clang-tidy on changed files
        env:
          CLANG_TIDY: clang-tidy-18
          TIDY_MAX_FILES: "20"
          SUMMARY_FILE: ${{ github.step_summary }}
        run: ./scripts/check-tidy.sh "$BASE_REF" build/tidy
