name: Doxygen

on:
  push:
    branches: [master]
    paths:
      - 'src/include/**'
      - 'Doxyfile'
      - 'docs/**'
      - '.github/workflows/doxygen.yml'
  workflow_dispatch:

concurrency:
  group: doxygen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          doxygen --version

      # Pages must already be enabled for the repository (build type
      # "workflow"). There is no actions/enable-pages action.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check Doxyfile version against CMakeLists.txt
        run: |
          doxyfile_version="$(sed -n 's/^PROJECT_NUMBER *=[ ]*"\([^"]*\)".*/\1/p' Doxyfile)"
          cmake_version="$(sed -n 's/^set(BASE_LIBRARY_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          if [ "$doxyfile_version" != "$cmake_version" ]; then
            echo "::error::Doxyfile PROJECT_NUMBER $doxyfile_version does not match BASE_LIBRARY_VERSION $cmake_version"
            exit 1
          fi
          echo "version $cmake_version verified"

      # WARN_AS_ERROR is set in the Doxyfile, so any new documentation warning
      # fails this job. Baseline is zero warnings.
      - name: Generate Doxygen documentation
        run: |
          # Doxygen creates OUTPUT_DIRECTORY but not its parents
          mkdir -p build/doxygen
          doxygen Doxyfile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/doxygen/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
